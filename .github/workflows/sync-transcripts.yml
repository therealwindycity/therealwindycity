name: Sync new meeting transcripts

on:
  schedule:
    - cron: "0 9 * * *"  # daily 09:00 UTC
  workflow_dispatch:  # manual "Run workflow" button

permissions:
  contents: write
  issues: write

concurrency:
  group: transcript-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cheyenne-2026-transcripts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Deno (YouTube challenge solver)
        uses: denoland/setup-deno@v1

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Restore YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then
            echo "::warning::YOUTUBE_COOKIES secret is not set — discovery only, no downloads."
          else
            printf '%s' "$YT_COOKIES" > cookies.txt
            chmod 600 cookies.txt
          fi

      - name: Sync new meetings
        run: python3 scripts/sync_new_meetings.py

      - name: Commit and push changes
        if: always()
        working-directory: .
        run: |
          git config user.name "transcript-bot"
          git config user.email "transcript-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync: add new meeting transcripts"
            git push
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Transcript sync needs attention';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            });
            if (issues.some(i => i.title === title)) { return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: [
                'The transcript sync run failed: ' + context.payload.repository.html_url + '/actions',
                '',
                '**Most likely cause:** the `YOUTUBE_COOKIES` secret expired. Refresh it:',
                '1. Export a fresh `cookies.txt` from a logged-in YouTube session (Get cookies.txt LOCALLY extension).',
                '2. Repo Settings → Secrets and variables → Actions → edit `YOUTUBE_COOKIES`, paste the whole file.',
                '3. Re-run the workflow from the Actions tab.',
              ].join('\n'),
            });
