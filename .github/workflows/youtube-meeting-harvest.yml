name: youtube-meeting-harvest

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: youtube-meeting-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python3 -m pip install --disable-pip-version-check yt-dlp
      - name: Enumerate public YouTube uploads
        run: python3 -u tools/youtube_meeting_harvest.py
      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wyoming-youtube-meetings
          path: youtube_harvest/*.csv
          if-no-files-found: error
