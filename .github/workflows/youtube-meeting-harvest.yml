name: youtube-meeting-harvest

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/youtube-meeting-harvest.yml'
      - 'tools/youtube_meeting_harvest.py'
      - 'tools/wyoming_youtube_channels.json'

permissions:
  contents: write

concurrency:
  group: youtube-meeting-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python3 -m pip install --disable-pip-version-check yt-dlp
      - name: Enumerate public YouTube uploads
        run: python3 -u tools/youtube_meeting_harvest.py
      - name: Commit harvested CSVs to the working branch
        run: |
          git config user.name "youtube-harvest-bot"
          git config user.email "youtube-harvest@localhost"
          git add youtube_harvest/*.csv
          if git diff --cached --quiet; then
            echo "harvest outputs unchanged"
          else
            git commit -m "YouTube harvest outputs"
            git pull --rebase origin "${GITHUB_HEAD_REF}"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wyoming-youtube-meetings
          path: youtube_harvest/*.csv
          if-no-files-found: error
